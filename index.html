<html lang="ja">
<head>
<meta charset="utf-8">

<title>DELF B2 アウトプット表現集</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--line:#d9dee7;--accent:#315b8a;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{max-width:820px;margin:auto;padding:24px 14px 50px} h1{font-size:26px;margin:0 0 6px} .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
.controls{position:sticky;top:0;background:rgba(244,246,248,.96);padding:10px 0;z-index:3}
input,select{width:100%;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
.stats{font-size:13px;color:var(--muted);margin:4px 2px 10px} .grid{display:grid;gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between} .ja{font-weight:700;font-size:17px;line-height:1.45}
.badge{font-size:11px;color:var(--muted);background:#f2f4f7;padding:4px 7px;border-radius:999px;white-space:nowrap}
.reveal{margin-top:11px;width:100%;padding:10px;border:1px solid var(--line);background:#fafafa;border-radius:10px;font-weight:600;font-size:15px}
.answer{display:none;margin-top:12px;border-top:1px solid #eee;padding-top:12px} .answer.show{display:block}
.fr{font-size:18px;font-weight:700;line-height:1.45} .ex{margin-top:8px;font-size:14px;line-height:1.5} .note{margin-top:6px;color:var(--muted);font-size:13px}
.status{display:flex;gap:6px;margin-top:12px} .status button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 3px;font-size:12px}
.status button.active{font-weight:700;outline:2px solid #98a2b3} .empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body><main class="wrap">
<h1>DELF B2 アウトプット表現集</h1>
<p class="lead">和文仏訳 Q1–Q15 で出てきた、能動化したい表現を重複整理。日本語を見てフランス語を思い出してから「答えを表示」。進捗はこの端末に保存されます。</p>
<div class="controls">
<input id="search" type="search" placeholder="日本語・フランス語・例文を検索">
<select id="cat"><option value="">すべてのカテゴリ</option></select>
<select id="filter">
<option value="">すべてのステータス</option><option value="new">未学習</option><option value="learning">学習中</option><option value="mastered">習得</option>
</select>
<div class="stats" id="stats"></div>
</div>
<div class="grid" id="grid"></div>
</main>
<script>
const DATA=[{"ja": "必ずしも～ではない", "fr": "ne ... pas nécessairement", "cat": "汎用B2", "ex": "Un salaire élevé ne garantit pas nécessairement la satisfaction au travail.", "note": "「必ずしも～とは限らない」。", "id": "b2_001"}, {"ja": "常に～とは限らない", "fr": "ne ... pas toujours", "cat": "汎用B2", "ex": "Les informations qu'on trouve en ligne ne sont pas toujours fiables.", "note": "「常に」を否定するとき。", "id": "b2_002"}, {"ja": "人が～することを可能にする", "fr": "permettre à quelqu'un de + infinitif", "cat": "汎用B2", "ex": "Cette formation permet aux employés de développer leurs compétences.", "note": "非常に汎用性が高い。", "id": "b2_003"}, {"ja": "～する機会を増やす", "fr": "multiplier les occasions de + infinitif", "cat": "汎用B2", "ex": "Il faut multiplier les occasions de pratiquer le français.", "note": "opportunité より occasion が自然な場面が多い。", "id": "b2_004"}, {"ja": "～に悪影響を与える", "fr": "avoir un impact négatif sur", "cat": "汎用B2", "ex": "Le tourisme de masse peut avoir un impact négatif sur l'environnement.", "note": "positif に置換可能。", "id": "b2_005"}, {"ja": "～という欠点がある", "fr": "présenter l'inconvénient de + infinitif", "cat": "汎用B2", "ex": "Les cours en ligne présentent l'inconvénient d'offrir moins d'interactions.", "note": "avantage と対で使える。", "id": "b2_006"}, {"ja": "～という利点がある", "fr": "présenter l'avantage de + infinitif", "cat": "汎用B2", "ex": "Cette solution présente l'avantage de réduire les coûts.", "note": "inconvénient と対で使える。", "id": "b2_007"}, {"ja": "長期的に", "fr": "à long terme", "cat": "汎用B2", "ex": "Cette mesure pourrait être efficace à long terme.", "note": "作文で使いやすい時間表現。", "id": "b2_008"}, {"ja": "～に対処する", "fr": "faire face à un problème", "cat": "社会・環境", "ex": "Le gouvernement doit faire face aux problèmes environnementaux.", "note": "faire face à + 名詞。", "id": "b2_009"}, {"ja": "政策を導入する", "fr": "mettre en place une politique", "cat": "社会・環境", "ex": "Le gouvernement a mis en place de nouvelles politiques.", "note": "制度・施策にも使える。", "id": "b2_010"}, {"ja": "公共交通機関", "fr": "les transports en commun", "cat": "社会・環境", "ex": "Il faut encourager l'utilisation des transports en commun.", "note": "transport public も可能だが頻用表現。", "id": "b2_011"}, {"ja": "交通渋滞を減らす", "fr": "réduire les embouteillages", "cat": "社会・環境", "ex": "Les transports en commun peuvent réduire les embouteillages.", "note": "atasco はスペイン語。", "id": "b2_012"}, {"ja": "大気汚染を減らす", "fr": "réduire la pollution de l'air", "cat": "社会・環境", "ex": "Cette mesure pourrait réduire la pollution de l'air.", "note": "pollution de l'air。", "id": "b2_013"}, {"ja": "大気の質を改善する", "fr": "améliorer la qualité de l'air", "cat": "社会・環境", "ex": "Les vélos contribuent à améliorer la qualité de l'air.", "note": "自然な言い換え。", "id": "b2_014"}, {"ja": "環境に配慮した", "fr": "respectueux / respectueuse de l'environnement", "cat": "社会・環境", "ex": "Les consommateurs recherchent des produits respectueux de l'environnement.", "note": "性数一致に注意。", "id": "b2_015"}, {"ja": "地域経済", "fr": "l'économie locale", "cat": "社会・環境", "ex": "Le tourisme présente des avantages pour l'économie locale.", "note": "locale は économie に一致。", "id": "b2_016"}, {"ja": "住民の生活", "fr": "la vie des habitants", "cat": "社会・環境", "ex": "Le tourisme peut affecter la vie des habitants.", "note": "habitants = 住民。", "id": "b2_017"}, {"ja": "知識を身につける", "fr": "acquérir des connaissances", "cat": "教育・語学", "ex": "L'université permet d'acquérir des connaissances spécialisées.", "note": "obtenir より自然。", "id": "b2_018"}, {"ja": "専門的な知識", "fr": "des connaissances spécialisées", "cat": "教育・語学", "ex": "Les étudiants acquièrent des connaissances spécialisées.", "note": "spécial より spécialisé。", "id": "b2_019"}, {"ja": "批判的に考える", "fr": "penser de manière critique", "cat": "教育・語学", "ex": "L'université aide les étudiants à penser de manière critique.", "note": "B2作文で有用。", "id": "b2_020"}, {"ja": "～する能力を養う", "fr": "développer sa capacité à + infinitif", "cat": "教育・語学", "ex": "Il faut développer sa capacité à penser de manière critique.", "note": "capacité à + inf.。", "id": "b2_021"}, {"ja": "外国語を学ぶ", "fr": "apprendre une langue étrangère", "cat": "教育・語学", "ex": "Apprendre une langue étrangère demande du temps.", "note": "langue は女性名詞。", "id": "b2_022"}, {"ja": "言語を実際に使う", "fr": "pratiquer une langue", "cat": "教育・語学", "ex": "Il est essentiel de pratiquer régulièrement la langue.", "note": "utiliser より自然な場合が多い。", "id": "b2_023"}, {"ja": "学習環境", "fr": "un environnement d'apprentissage", "cat": "教育・語学", "ex": "Les cours en ligne offrent un environnement d'apprentissage flexible.", "note": "enseignement/enseignant と区別。", "id": "b2_024"}, {"ja": "人と交流する", "fr": "échanger avec quelqu'un", "cat": "教育・語学", "ex": "Les étudiants peuvent échanger avec d'autres étudiants.", "note": "avec が必要。", "id": "b2_025"}, {"ja": "対面授業", "fr": "les cours en présentiel", "cat": "教育・語学", "ex": "Certains étudiants préfèrent les cours en présentiel.", "note": "présentiel はスペイン語 presencial と区別。", "id": "b2_026"}, {"ja": "スキルを伸ばす", "fr": "développer ses compétences", "cat": "仕事・ビジネス", "ex": "La formation permet de développer ses compétences.", "note": "habilidad ではなく compétence。", "id": "b2_027"}, {"ja": "研修の機会", "fr": "des possibilités de formation", "cat": "仕事・ビジネス", "ex": "Les entreprises devraient offrir des possibilités de formation.", "note": "formation = 企業研修。", "id": "b2_028"}, {"ja": "仕事への意欲", "fr": "la motivation au travail", "cat": "仕事・ビジネス", "ex": "La formation peut accroître la motivation au travail.", "note": "au travail。", "id": "b2_029"}, {"ja": "意欲を高める", "fr": "accroître la motivation", "cat": "仕事・ビジネス", "ex": "Une bonne ambiance peut accroître la motivation.", "note": "augmenter も可。", "id": "b2_030"}, {"ja": "高い給料", "fr": "un salaire élevé", "cat": "仕事・ビジネス", "ex": "Un salaire élevé est un facteur important.", "note": "salarié = 従業員。", "id": "b2_031"}, {"ja": "重要な要素", "fr": "un facteur important", "cat": "仕事・ビジネス", "ex": "Le salaire est un facteur important dans le choix d'un emploi.", "note": "factor はスペイン語。", "id": "b2_032"}, {"ja": "仕事を選ぶ", "fr": "choisir un emploi", "cat": "仕事・ビジネス", "ex": "Plusieurs facteurs interviennent lorsqu'on choisit un emploi.", "note": "emploi = 職。", "id": "b2_033"}, {"ja": "仕事に満足している", "fr": "être satisfait de son travail", "cat": "仕事・ビジネス", "ex": "Il est important d'être satisfait de son travail.", "note": "satisfait de。", "id": "b2_034"}, {"ja": "企業イメージを改善する", "fr": "améliorer l'image de l'entreprise", "cat": "仕事・ビジネス", "ex": "Ces initiatives peuvent améliorer l'image de l'entreprise.", "note": "image は女性名詞。", "id": "b2_035"}, {"ja": "新規顧客を獲得する", "fr": "attirer de nouveaux clients", "cat": "仕事・ビジネス", "ex": "Une bonne réputation permet d'attirer de nouveaux clients.", "note": "acquisition de clients もビジネスでは可。", "id": "b2_036"}, {"ja": "生産性を向上させる", "fr": "améliorer la productivité", "cat": "仕事・ビジネス", "ex": "Le télétravail peut améliorer la productivité.", "note": "développer より améliorer。", "id": "b2_037"}, {"ja": "高い生産性", "fr": "une productivité élevée", "cat": "仕事・ビジネス", "ex": "Il est difficile de maintenir une productivité élevée.", "note": "élevée は女性形。", "id": "b2_038"}, {"ja": "仕事と私生活のバランスを保つ", "fr": "maintenir un équilibre entre le travail et la vie privée", "cat": "仕事・ビジネス", "ex": "Il faut maintenir un bon équilibre entre le travail et la vie privée.", "note": "balance ではなく équilibre。", "id": "b2_039"}, {"ja": "ストレスを減らす", "fr": "réduire le stress", "cat": "仕事・ビジネス", "ex": "Un bon équilibre permet de réduire le stress.", "note": "通常 stress は単数。", "id": "b2_040"}, {"ja": "海外で生活する", "fr": "vivre à l'étranger", "cat": "生活・社会", "ex": "Vivre à l'étranger permet de découvrir d'autres cultures.", "note": "à l'étranger。", "id": "b2_041"}, {"ja": "新しい文化を知る", "fr": "découvrir de nouvelles cultures", "cat": "生活・社会", "ex": "Voyager permet de découvrir de nouvelles cultures.", "note": "connaître より découvrir が自然。", "id": "b2_042"}, {"ja": "自分とは異なる価値観", "fr": "des valeurs différentes des siennes / des leurs", "cat": "生活・社会", "ex": "Il est utile de comprendre des valeurs différentes des siennes.", "note": "主語に応じ siennes/leurs。", "id": "b2_043"}, {"ja": "SNS", "fr": "les réseaux sociaux", "cat": "情報・メディア", "ex": "Les réseaux sociaux permettent de partager des informations.", "note": "sociaux は男性複数。", "id": "b2_044"}, {"ja": "情報を共有する", "fr": "partager des informations", "cat": "情報・メディア", "ex": "Internet permet de partager facilement des informations.", "note": "compartir はスペイン語。", "id": "b2_045"}, {"ja": "信頼できる情報", "fr": "des informations fiables", "cat": "情報・メディア", "ex": "Il faut rechercher des informations fiables.", "note": "faible = 弱い、fiable = 信頼できる。", "id": "b2_046"}, {"ja": "誤った情報", "fr": "des informations erronées", "cat": "情報・メディア", "ex": "Il faut éviter de diffuser des informations erronées.", "note": "erroné = 誤った。", "id": "b2_047"}, {"ja": "情報にアクセスできる", "fr": "avoir accès à l'information", "cat": "情報・メディア", "ex": "Grâce à Internet, nous avons facilement accès à l'information.", "note": "avoir accès à。", "id": "b2_048"}, {"ja": "AとBを見分ける", "fr": "distinguer A de B", "cat": "情報・メディア", "ex": "Il faut distinguer les informations fiables des informations erronées.", "note": "distinguer A de B。", "id": "b2_049"}, {"ja": "以前より簡単に", "fr": "plus facilement qu'avant", "cat": "情報・メディア", "ex": "Nous communiquons plus facilement qu'avant.", "note": "比較対象 qu'avant。", "id": "b2_050"}, {"ja": "自転車で通勤する", "fr": "aller au travail à vélo", "cat": "生活・社会", "ex": "Aller au travail à vélo présente plusieurs avantages.", "note": "commuter は使わない。", "id": "b2_051"}, {"ja": "交通費を節約する", "fr": "économiser sur les frais de transport", "cat": "生活・社会", "ex": "Le vélo permet d'économiser sur les frais de transport.", "note": "frais de transport。", "id": "b2_052"}, {"ja": "運動する", "fr": "faire de l'exercice", "cat": "生活・社会", "ex": "Il est important de faire régulièrement de l'exercice.", "note": "prendre exercise ではない。", "id": "b2_053"}];
const KEY='delf_b2_output_phrases_v2_stable_ids';
let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cats=[...new Set(DATA.map(x=>x.cat))];
const cat=document.getElementById('cat'); cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});
function statusOf(id){return saved[id]||'new'}
function setStatus(id,s){saved[id]=s;localStorage.setItem(KEY,JSON.stringify(saved));render()}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase(), c=cat.value, f=document.getElementById('filter').value;
 const rows=DATA.filter(x=>(!c||x.cat===c)&&(!f||statusOf(x.id)===f)&&(!q||[x.ja,x.fr,x.ex,x.note].join(' ').toLowerCase().includes(q)));
 document.getElementById('stats').textContent=`表示 ${rows.length} / ${DATA.length}　習得 ${DATA.filter(x=>statusOf(x.id)==='mastered').length}`;
 const g=document.getElementById('grid'); g.innerHTML='';
 if(!rows.length){g.innerHTML='<div class="empty">該当する表現はありません。</div>';return}
 rows.forEach(x=>{
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class="top"><div class="ja">${esc(x.ja)}</div><span class="badge">${esc(x.cat)}</span></div>
  <button class="reveal">答えを表示</button>
  <div class="answer"><div class="fr">${esc(x.fr)}</div><div class="ex">${esc(x.ex)}</div><div class="note">${esc(x.note)}</div></div>
  <div class="status">
  <button data-s="new" class="${statusOf(x.id)==='new'?'active':''}">未学習</button>
  <button data-s="learning" class="${statusOf(x.id)==='learning'?'active':''}">学習中</button>
  <button data-s="mastered" class="${statusOf(x.id)==='mastered'?'active':''}">習得</button></div>`;
  d.querySelector('.reveal').onclick=e=>{const a=d.querySelector('.answer');a.classList.toggle('show');e.target.textContent=a.classList.contains('show')?'答えを隠す':'答えを表示'};
  d.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setStatus(x.id,b.dataset.s));
  g.appendChild(d);
 });
}
document.getElementById('search').addEventListener('input',render);cat.addEventListener('change',render);document.getElementById('filter').addEventListener('change',render);render();
</script></body></html>
